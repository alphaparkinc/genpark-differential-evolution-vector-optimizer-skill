[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-differential-evolution-vector-optimizer-skill"
version = "1.0.0"
description = "Differential Evolution (DE/rand/1/bin) continuous optimizer with donor vector mutation and binomial crossover."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-differential-evolution-vector-optimizer-skill"
Repository = "https://github.com/alphaparkinc/genpark-differential-evolution-vector-optimizer-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-differential-evolution-vector-optimizer-skill/issues"
